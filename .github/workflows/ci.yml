name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays: try the newest Go release
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: todo
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    strategy:
      matrix:
        go: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go install golang.org/x/tools/gopls@v0.23.0
      - run: go vet ./...
      - run: go test -race ./...
      - name: ego fmt formats the standard library like gofmt (skipped under -race)
        run: go test ./internal/syntax/format
      - run: go build -o "$RUNNER_TEMP/ego" ./cmd/ego
      - name: generated code is up to date
        run: |
          "$RUNNER_TEMP/ego" generate -check ./...
          (cd examples && "$RUNNER_TEMP/ego" generate -check ./...)
      - name: .ego files are formatted
        run: test -z "$("$RUNNER_TEMP/ego" fmt -l .)"
      - run: test -z "$(gofmt -l $(git ls-files '*.go' | grep -v '^internal/syntax/'))"
      - working-directory: examples
        env:
          TODO_TEST_DATABASE_URL: postgres://postgres@localhost:5432/todo?sslmode=disable
        run: go vet ./... && go test -race ./...

  # A new Go release may add syntax the forked parser doesn't know. This job
  # formats and compiles the newest standard library; when it fails, run
  # go run ./internal/syntax/sync go1.N.M (see internal/syntax/README.md).
  newest-go:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: go version && cat internal/syntax/UPSTREAM
      - run: go test ./internal/syntax/... ./internal/lower/...
